version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkplease_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkplease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkplease"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkplease_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: linkplease_app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/linkplease
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/linkplease
      - REDIS_URL=redis://redis:6379/0
      - PSEUDOGRAM_BASE_URL=https://pseudogram-api.onrender.com
      - PSEUDOGRAM_API_KEY=${PSEUDOGRAM_API_KEY:-replace_me}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: linkplease_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/linkplease
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/linkplease
      - REDIS_URL=redis://redis:6379/0
      - PSEUDOGRAM_BASE_URL=https://pseudogram-api.onrender.com
      - PSEUDOGRAM_API_KEY=${PSEUDOGRAM_API_KEY:-replace_me}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
